name: Announce Atlas Update

on:
  workflow_run:
    workflows: ["Deploy MOSCATELLI Atlas"]
    types: [completed]

permissions:
  contents: read

jobs:
  announce:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Prepare elegant release summary
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess

          sha = os.environ["ATLAS_SHA"]
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          headline = git("show", "-s", "--format=%s", sha)
          body = git("show", "-s", "--format=%b", sha)
          summary = " ".join(line.strip() for line in body.splitlines() if line.strip())
          if not summary:
              summary = "The latest production refinement is now available in Atlas."
          author = git("show", "-s", "--format=%an", sha)
          changes = [line for line in git("diff-tree", "--no-commit-id", "--name-only", "-r", sha).splitlines() if line]
          payload = {
              "kind": "atlas_deployment",
              "sha": sha,
              "headline": headline,
              "summary": summary,
              "author": author,
              "changes": changes,
              "commit_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{sha}",
              "atlas_url": "https://gianmoska-prog.github.io/moscatelliatlas/",
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "atlas-update.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False)
          PY
        env:
          ATLAS_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Notify the Atlas channel
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2
          --request POST
          --header "Content-Type: application/json"
          --header "x-atlas-secret: ${{ secrets.ATLAS_DEPLOY_SECRET }}"
          --data-binary "@$RUNNER_TEMP/atlas-update.json"
          https://htxzyqjynthuxrhnfcrj.supabase.co/functions/v1/mainhub-slack
